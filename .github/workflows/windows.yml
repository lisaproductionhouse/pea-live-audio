name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2" --locked

    - name: Build Tauri App (GUI)
      # Bắt buộc phải chạy trong thư mục app theo đúng README
      working-directory: ./app
      run: cargo tauri build --bundles nsis

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: fbaudio-windows-setup
        # Lấy chính xác thư mục chứa bộ cài đặt NSIS
        path: app/src-tauri/target/release/bundle/nsis/*.exe