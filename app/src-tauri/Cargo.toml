[package]
name = "fbaudio"
version = "0.1.0"
description = "Nghe Facebook Live chỉ bằng âm thanh, độ trễ thấp"
edition = "2021"

[lib]
# Tên thư viện phải khớp với những gì Tauri mobile nạp (<tên>_lib).
name = "fbaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Giải mã HE-AAC đầy đủ (SBR + PS) bằng FDK-AAC; cần trình biên dịch C++.
# Dùng:  cargo tauri build --features sbr
sbr = ["fbaudio-core/sbr"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
fbaudio-core = { path = "../../core" }

# Giải mã AAC + resample cần mã đã tối ưu. Nếu để opt-level=0, bản `--debug` (APK ký debug, cài
# thẳng được) sẽ chạy chậm và tốn pin trên điện thoại.
[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Project độc lập, không thuộc workspace ở thư mục gốc (đúng bố cục chuẩn của `cargo tauri`).
[workspace]
